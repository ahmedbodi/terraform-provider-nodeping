# Trivy exceptions.
#
# Currently empty on purpose: there are no accepted findings.
#
# If an entry ever becomes necessary, it MUST carry an `expired_at` date so the
# suppression cannot silently become permanent — once the date passes the
# finding starts failing the pipeline again. Fix the underlying issue and delete
# the entry rather than extending the date.
#
# Never add anything under `secrets:`. Secret findings are always blocking.
#
# Example:
#
# vulnerabilities:
#   - id: CVE-0000-00000
#     statement: "why this is accepted, and what unblocks it"
#     expired_at: 2026-12-31
#
# --- Deliberately NOT listed here ------------------------------------------
#
# GO-2026-5932 (golang.org/x/crypto/openpgp is unmaintained)
#
#   Trivy reports it because the golang.org/x/crypto module is present, but the
#   advisory concerns the openpgp package, which is not in our build graph:
#
#     go list -deps ./...      -> no golang.org/x/crypto/openpgp
#     go mod why -m x/crypto   -> reached only via x/crypto/sha3, and only
#                                 through terraform-plugin-testing ->
#                                 hc-install, a test-only dependency
#     govulncheck ./...        -> "No vulnerabilities found"
#
#   It is not suppressed here for two reasons. First, suppression would buy
#   nothing: the finding is severity UNKNOWN and the gate fails on HIGH and
#   CRITICAL, so it never blocked the build. Second, the advisory has no fixed
#   version and never will, so an `expired_at` date would be meaningless — the
#   entry could only ever be renewed, which is exactly the pattern this file is
#   meant to prevent.
#
#   It is instead dismissed on the GitHub code-scanning alert, which keeps an
#   audit trail and can be reopened. The govulncheck job in
#   .github/workflows/security.yml is the authoritative control for Go: it works
#   on symbol-level reachability and will fail the build if this ever becomes
#   genuinely reachable.
