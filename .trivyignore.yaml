# Trivy exceptions.
#
# Currently empty on purpose: there are no accepted findings.
#
# If an entry ever becomes necessary, it MUST carry an `expired_at` date so the
# suppression cannot silently become permanent — once the date passes the
# finding starts failing the pipeline again. Fix the underlying issue and delete
# the entry rather than extending the date.
#
# Never add anything under `secrets:`. Secret findings are always blocking.
#
# Example:
#
# vulnerabilities:
#   - id: CVE-0000-00000
#     statement: "why this is accepted, and what unblocks it"
#     expired_at: 2026-12-31
