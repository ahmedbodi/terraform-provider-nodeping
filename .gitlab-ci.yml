stages:
  - lint
  - security
  - test
  - build
  - release

variables:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: "v1.62.0"
  GOSEC_VERSION: "v2.21.0"
  GITLEAKS_VERSION: "v8.30.1"
  TRIVY_VERSION: "0.74.0"
  TERRAFORM_VERSION: "1.14.9"

.go-cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key: ${CI_COMMIT_REF_SLUG}-v2
    paths:
      - .go/pkg/mod/

lint:
  stage: lint
  image: golangci/golangci-lint:${GOLANGCI_LINT_VERSION}
  extends: .go-cache
  script:
    - golangci-lint run --timeout 5m
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

fmt:
  stage: lint
  image: golang:${GO_VERSION}
  extends: .go-cache
  script:
    - test -z "$(gofmt -l .)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security:
  stage: security
  image: securego/gosec:${GOSEC_VERSION}
  script:
    - gosec -exclude-generated ./...
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Secret detection -------------------------------------------------------
# Blocking by design. A committed secret has to be rotated no matter how fast it
# is reverted, so it must never reach the default branch in the first place.
secret-detection:
  stage: security
  image:
    name: zricethezav/gitleaks:${GITLEAKS_VERSION}
    entrypoint: [""]
  variables:
    # Scan the whole history, not just the last 50 commits GitLab clones by
    # default -- otherwise a secret in an older commit is invisible.
    GIT_DEPTH: "0"
  script:
    # --redact keeps detected values out of the job log; without it a finding
    # would leak the secret a second time, into CI output.
    - |
      gitleaks detect \
        --source="$CI_PROJECT_DIR" \
        --config="$CI_PROJECT_DIR/.gitleaks.toml" \
        --report-format sarif \
        --report-path gitleaks.sarif \
        --redact \
        --no-banner \
        --exit-code 1
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - gitleaks.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- Trivy ------------------------------------------------------------------
.trivy-base:
  image:
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: .trivycache/
  cache:
    key: trivy-db
    paths:
      - .trivycache/

trivy-scan:
  stage: security
  extends: .trivy-base
  script:
    # Pass 1: full report, never fails -- keeps findings visible while an
    # exception in .trivyignore.yaml is active.
    - trivy fs --scanners vuln,secret,misconfig --exit-code 0 "$CI_PROJECT_DIR"
    - trivy fs --scanners vuln,secret,misconfig --format json --output trivy.json --exit-code 0 "$CI_PROJECT_DIR"
    - trivy fs --scanners vuln --format template --template "@/contrib/gitlab.tpl" --output gl-dependency-scanning-report.json --exit-code 0 "$CI_PROJECT_DIR"
    # Pass 2: the gate. Every exception carries an expiry date, so suppressions
    # cannot quietly become permanent.
    - |
      trivy fs \
        --scanners vuln,secret,misconfig \
        --severity HIGH,CRITICAL \
        --ignorefile "$CI_PROJECT_DIR/.trivyignore.yaml" \
        --exit-code 1 \
        "$CI_PROJECT_DIR"
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - trivy.json
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

unit-test:
  stage: test
  image: golang:${GO_VERSION}
  extends: .go-cache
  script:
    - go test -v -race -coverprofile=coverage.out -coverpkg=./... ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Acceptance tests drive a real terraform binary against an in-process mock of
# the NodePing API. They need no credentials and make no calls to nodeping.com,
# so unlike the previous manual job they can run on every pipeline.
acceptance-test:
  stage: test
  image: golang:${GO_VERSION}
  extends: .go-cache
  variables:
    TF_ACC: "1"
    TF_ACC_TERRAFORM_PATH: /usr/local/bin/terraform
  before_script:
    - curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
    - unzip -q -o /tmp/tf.zip -d /usr/local/bin
    - terraform version
  script:
    - go test -v -timeout 20m -run 'TestAcc' ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: build
  image: golang:${GO_VERSION}
  extends: .go-cache
  script:
    - go build -v -o terraform-provider-nodeping .
  artifacts:
    paths:
      - terraform-provider-nodeping
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-multi-platform:
  stage: build
  image: golang:${GO_VERSION}
  extends: .go-cache
  script:
    - mkdir -p dist
    - GOOS=linux GOARCH=amd64 go build -o dist/terraform-provider-nodeping_linux_amd64 .
    - GOOS=linux GOARCH=arm64 go build -o dist/terraform-provider-nodeping_linux_arm64 .
    - GOOS=darwin GOARCH=amd64 go build -o dist/terraform-provider-nodeping_darwin_amd64 .
    - GOOS=darwin GOARCH=arm64 go build -o dist/terraform-provider-nodeping_darwin_arm64 .
    - GOOS=windows GOARCH=amd64 go build -o dist/terraform-provider-nodeping_windows_amd64.exe .
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

publish-packages:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: build-multi-platform
      artifacts: true
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      for file in dist/*; do
        filename=$(basename "$file")
        echo "Uploading $filename to package registry..."
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/terraform-provider-nodeping/${VERSION}/${filename}"
      done
  rules:
    - if: $CI_COMMIT_TAG

sbom:
  stage: build
  image: golang:${GO_VERSION}
  extends: .go-cache
  script:
    - go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
    - $(go env GOPATH)/bin/cyclonedx-gomod mod -json -output sbom.json
  artifacts:
    paths:
      - sbom.json
    expire_in: 1 year
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-multi-platform
      artifacts: true
    - job: sbom
      artifacts: true
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "Release ${CI_COMMIT_TAG}"
    description: |
      ## Terraform Provider NodePing ${CI_COMMIT_TAG}
      
      ### Installation
      
      Add to your Terraform configuration:
      ```hcl
      terraform {
        required_providers {
          nodeping = {
            source  = "gitlab.nxs360.com/devops/terraform/terraform-provider-nodeping"
            version = "${CI_COMMIT_TAG}"
          }
        }
      }
      ```
      
      ### Assets
      - Linux AMD64
      - Linux ARM64
      - macOS AMD64
      - macOS ARM64
      - Windows AMD64
      - SBOM (CycloneDX)
    assets:
      links:
        - name: "terraform-provider-nodeping_linux_amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/terraform-provider-nodeping_linux_amd64?job=build-multi-platform"
          filepath: "/terraform-provider-nodeping_linux_amd64"
        - name: "terraform-provider-nodeping_linux_arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/terraform-provider-nodeping_linux_arm64?job=build-multi-platform"
          filepath: "/terraform-provider-nodeping_linux_arm64"
        - name: "terraform-provider-nodeping_darwin_amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/terraform-provider-nodeping_darwin_amd64?job=build-multi-platform"
          filepath: "/terraform-provider-nodeping_darwin_amd64"
        - name: "terraform-provider-nodeping_darwin_arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/terraform-provider-nodeping_darwin_arm64?job=build-multi-platform"
          filepath: "/terraform-provider-nodeping_darwin_arm64"
        - name: "terraform-provider-nodeping_windows_amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/terraform-provider-nodeping_windows_amd64.exe?job=build-multi-platform"
          filepath: "/terraform-provider-nodeping_windows_amd64.exe"
        - name: "sbom.json"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/sbom.json?job=sbom"
          filepath: "/sbom.json"
  rules:
    - if: $CI_COMMIT_TAG
